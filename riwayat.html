<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iuran & Riwayat — ProtectAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="toastContainer" class="toast-container"></div>

<div class="app-shell">
  <div class="page">
    <header class="dash-header">
      <div><p class="dash-greeting" id="dashGreeting">Selamat datang</p><h2 id="dashNama">Peserta</h2></div>
      <button class="icon-btn" onclick="handleLogout()">⎋</button>
    </header>

    <div class="topbar"><a class="icon-btn" href="home.html">←</a><h3>Iuran &amp; Riwayat Pembayaran</h3></div>

    <div class="card">
      <p class="hint">Tagihan bulan ini: <b id="tagihanNominal">-</b></p>
      <label class="field-label">Metode Pembayaran</label>
      <select id="metodeBayar" class="field">
        <option>BCA Mobile</option>
        <option>Livin by Mandiri</option>
        <option>BRImo</option>
        <option>M-Banking BNI</option>
        <option>Saldo ProtectAI (In-App)</option>
      </select>
      <button class="btn btn-primary btn-block" onclick="bayarIuran()">Bayar Sekarang</button>
      <div id="bayarStatus" class="status-line"></div>
    </div>

    <div class="card">
      <h4>Riwayat Pembayaran</h4>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-btn" href="home.html">🏠<span>Beranda</span></a>
  <a class="nav-btn" href="layanan.html">🧾<span>Layanan</span></a>
  <a class="nav-btn active" href="riwayat.html">💳<span>Riwayat</span></a>
  <a class="nav-btn" href="profil.html">👤<span>Profil</span></a>
</nav>

<!-- MODAL STRUK -->
<div id="receiptModal" class="modal hidden">
  <div class="modal-box receipt-box">
    <div id="receiptContent"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="window.print()">🖨️ Cetak</button>
      <button class="btn btn-outline" onclick="closeReceiptModal()">Tutup</button>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/common.js"></script>
<script src="js/riwayat.js"></script>
</body>
</html>
